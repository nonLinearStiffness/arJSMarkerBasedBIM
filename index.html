<!doctype HTML>
<html>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.2/aframe/build/aframe-ar.js"></script>
<body style="margin: 0px; overflow: hidden;">

<a-scene embedded vr-mode-ui="enabled: false;" arjs="debugUIEnabled: false;">

    <a-assets>
        <a-asset-item id="ccg" src="./models/ccg.glb"></a-asset-item>
	</a-assets>
    
    	<a-marker type="pattern" url="./pattern-marker.patt" 
      smooth="true" smoothCount="10" smoothTolerance="0.05" smoothThreshold="5">
        <a-entity   position="0 0.5 9.375" 
                    rotation="-90 0 0"
                    scale="6.25 6.25 6.25"
                    gltf-model="#ccg" >
                      <!-- Axis helper: X (red), Y (green), Z (blue) -->
          <a-cylinder color="red" radius="0.01" height="0.5" position="0 0 0.25" rotation="0 0 90"></a-cylinder>
          <a-cylinder color="green" radius="0.01" height="0.5" position="0 0.25 0" rotation="0 0 0"></a-cylinder>
          <a-cylinder color="blue" radius="0.01" height="0.5" position="0.25 0 0" rotation="0 90 0"></a-cylinder>

        </a-entity>
    </a-marker>
    
    <a-entity camera></a-entity>
    
</a-scene>
</body>
</html>
